  <text x="116" y="67" fill="#294538" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="47" font-weight="800" letter-spacing="3">SAND</text>
  <circle cx="270" cy="62" r="4.5" fill="#E5A928"/>
  <text x="119" y="91" fill="#496B4A" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" letter-spacing="3">고흥 유자 샌드</text>
</svg>
